name: Synthetic Python and MCP checks
on: [push, pull_request]
jobs:
  synthetic:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python run.py setup --python-only
      - run: python run.py verify
